<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pattern for mathematical symbols -->
    <pattern id="mathPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <text x="10" y="30" font-size="24" fill="#ffffff" opacity="0.1" font-family="Arial">∑</text>
      <text x="50" y="70" font-size="20" fill="#ffffff" opacity="0.08" font-family="Arial">∫</text>
      <text x="75" y="45" font-size="18" fill="#ffffff" opacity="0.09" font-family="Arial">π</text>
    </pattern>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  <rect width="1200" height="300" fill="url(#mathPattern)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="150" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="150" r="100" fill="#ffffff" opacity="0.05"/>
  <circle cx="600" cy="50" r="60" fill="#ffffff" opacity="0.08"/>
  
  <!-- Main Icon - Compass/Target -->
  <g transform="translate(100, 150)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    
    <!-- Compass arrows -->
    <path d="M 0,-35 L 8,-20 L 0,-25 L -8,-20 Z" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M 35,0 L 20,8 L 25,0 L 20,-8 Z" fill="#60a5fa" opacity="0.8"/>
    <path d="M 0,35 L 8,20 L 0,25 L -8,20 Z" fill="#60a5fa" opacity="0.8"/>
    <path d="M -35,0 L -20,8 L -25,0 L -20,-8 Z" fill="#60a5fa" opacity="0.8"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
  </g>
  
  <!-- Main Title -->
  <text x="220" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" filter="url(#shadow)">
    Χάρτης Στρατηγικών
  </text>
  
  <!-- Subtitle -->
  <text x="220" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="300" fill="#e0e7ff">
    Επίλυσης Μαθηματικών Προβλημάτων
  </text>
  
  <!-- Decorative line -->
  <line x1="220" y1="220" x2="950" y2="220" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Small mathematical symbols decoration -->
  <text x="950" y="100" font-family="Arial" font-size="36" fill="#ffffff" opacity="0.15">∑</text>
  <text x="980" y="130" font-family="Arial" font-size="28" fill="#ffffff" opacity="0.12">∫</text>
  <text x="1010" y="105" font-family="Arial" font-size="32" fill="#ffffff" opacity="0.13">∞</text>
</svg>
