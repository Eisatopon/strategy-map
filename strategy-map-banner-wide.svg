<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="728" height="90">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="728" height="90" fill="url(#bgGrad)"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="45" r="30" fill="#ffffff" opacity="0.05"/>
  <circle cx="678" cy="45" r="35" fill="#ffffff" opacity="0.05"/>
  
  <!-- Icon -->
  <g transform="translate(50, 45)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M 0,-15 L 4,-8 L 0,-11 L -4,-8 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Title -->
  <text x="85" y="40" font-family="'Segoe UI', Arial" font-size="24" font-weight="bold" fill="#ffffff" filter="url(#shadow)">
    Χάρτης Στρατηγικών
  </text>
  
  <!-- Subtitle -->
  <text x="85" y="62" font-family="'Segoe UI', Arial" font-size="14" fill="#e0e7ff">
    Επίλυσης Μαθηματικών Προβλημάτων
  </text>
  
  <!-- Math symbols -->
  <text x="620" y="35" font-family="Arial" font-size="20" fill="#ffffff" opacity="0.1">∑</text>
  <text x="640" y="60" font-family="Arial" font-size="16" fill="#ffffff" opacity="0.08">∫</text>
  <text x="680" y="45" font-family="Arial" font-size="18" fill="#ffffff" opacity="0.09">π</text>
</svg>
